name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    # The runtime image must build, and the native SQLite module must load
    # inside it: that is the part a plain `npm test` on the runner cannot
    # prove.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dailysmith-shopify-app:ci .
      - name: the image boots far enough to open a database
        run: |
          docker run --rm -e SHOPIFY_API_KEY=k -e SHOPIFY_API_SECRET=s -e DATABASE_PATH=/tmp/t.sqlite dailysmith-shopify-app:ci \
            node -e "import('./src/db.js').then(m => { const db = m.openDatabase(process.env.DATABASE_PATH); console.log('sqlite ok, tables:', db.raw.prepare(\"select count(*) as n from sqlite_master where type='table'\").get().n); })"
